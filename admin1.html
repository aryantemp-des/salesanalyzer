<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary Admin - Setup Baseline</title>
    <style>
        :root {
            --bg-dark: #090e17;
            --bg-card: #111827;
            --border: #1e293b;
            --primary: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif; padding: 2rem; margin: 0;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .container {
            width: 100%; max-width: 900px; background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 20px; padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; margin-top: 0; font-size: 2.2rem; background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align:center; color: var(--text-muted); margin-bottom:3rem; font-size: 1rem;}
        
        .section-title { 
            font-size: 1.1rem; color: #38bdf8; margin: 2rem 0 1.2rem; 
            border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; 
            text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
        }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group.full { grid-column: 1 / -1; }
        
        label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500;}
        input {
            padding: 1rem 1.2rem; border-radius: 10px; border: 1px solid var(--border);
            background: #0f1523; color: white; outline: none; font-family: inherit; font-size: 1rem;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(6,182,212,0.2); }
        
        button {
            width: 100%; padding: 1.2rem; background: linear-gradient(90deg, #06b6d4, #0ea5e9); color: white;
            border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700;
            margin-top: 3rem; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(6,182,212,0.2);
        }
        button:hover { box-shadow: 0 12px 25px rgba(6,182,212,0.4); transform: translateY(-2px);}
        
        .req { color: #f43f5e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Primary Admin Panel</h1>
        <div class="subtitle">
            Control main business & sales data.
            <div style="margin-top:0.75rem; background:rgba(6,182,212,0.1); border:1px solid rgba(6,182,212,0.3); border-radius:8px; padding:0.6rem 1rem; font-size:0.9rem;">
                ✨ <b>New:</b> Primary & Secondary Admins are now unified! <a href="admin.html" style="color:#38bdf8; font-weight:700; text-decoration:underline; margin-left:0.3rem;">Open admin.html</a>
            </div>
        </div>
        
        <form id="admin1Form" onsubmit="saveData(event)">
            <div class="section-title">Core Business Identity</div>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Google Maps URL (KEY) <span class="req">*</span></label>
                    <input id="mapsUrl" placeholder="https://maps.google.com/..." required>
                </div>
                <div class="form-group">
                    <label>Business Name</label>
                    <input id="businessName" placeholder="e.g. Brew & Co." required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input id="location" placeholder="e.g. New York, NY" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input id="category" placeholder="e.g. Home Services" required>
                </div>
                <div class="form-group">
                    <label>Maps Rating (e.g. 4.8)</label>
                    <input id="rating" type="number" step="0.1" placeholder="4.3" required>
                </div>
                <div class="form-group">
                    <label>Number of Reviews</label>
                    <input id="reviews" type="number" placeholder="23" required>
                </div>
            </div>

            <div class="section-title">Current Sales Metrics (Daily Baseline)</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Total Visitors (Maps)</label>
                    <input id="totalVisitors" type="number" placeholder="6264" required>
                </div>
                <div class="form-group">
                    <label>Converted Sales</label>
                    <input id="convertedSales" type="number" placeholder="1963" required>
                </div>
                <div class="form-group">
                    <label>Lost Sales</label>
                    <input id="lostSales" type="number" placeholder="4301" required>
                </div>
                <div class="form-group">
                    <label>Average Value Per Sale (₹)</label>
                    <input id="avgRevenue" type="number" placeholder="85" required>
                </div>
                <div class="form-group">
                    <label>Estimated Revenue Lost (₹) (Auto)</label>
                    <input id="revenueLost" type="number" placeholder="365600" required>
                </div>
            </div>

            <button type="submit">Save Business Data</button>
        </form>
    </div>

    <script>
        // Auto-calculate Lost Sales logic
        document.addEventListener('DOMContentLoaded', () => {
            const visitorsInput = document.getElementById("totalVisitors");
            const convertedInput = document.getElementById("convertedSales");
            const lostInput = document.getElementById("lostSales");
            const avgRevInput = document.getElementById("avgRevenue");
            const revLostInput = document.getElementById("revenueLost");

            function calcData() {
                const vis = parseInt(visitorsInput.value) || 0;
                const conv = parseInt(convertedInput.value) || 0;
                const avgRev = parseFloat(avgRevInput.value) || 0;
                
                let lost = 0;
                if (visitorsInput.value !== "" || convertedInput.value !== "") {
                    lost = Math.max(0, vis - conv);
                    lostInput.value = lost;
                } else {
                    lost = parseInt(lostInput.value) || 0;
                }

                if (lostInput.value !== "" || avgRevInput.value !== "") {
                    revLostInput.value = Math.round(lost * avgRev);
                }
            }

            visitorsInput.addEventListener("input", calcData);
            convertedInput.addEventListener("input", calcData);
            avgRevInput.addEventListener("input", calcData);
            lostInput.addEventListener("input", calcData); // if manually edited, adjust revlost

            // Pre-fill previously saved data if available
            try {
                const latestStr = localStorage.getItem("admin1_latest");
                if (latestStr) {
                    const saved = JSON.parse(latestStr);
                    if (saved.mapsUrl) document.getElementById("mapsUrl").value = saved.mapsUrl;
                    if (saved.name) document.getElementById("businessName").value = saved.name;
                    if (saved.location) document.getElementById("location").value = saved.location;
                    if (saved.category) document.getElementById("category").value = saved.category;
                    if (saved.rating) document.getElementById("rating").value = saved.rating;
                    if (saved.reviews) document.getElementById("reviews").value = saved.reviews;
                    if (saved.visitors) document.getElementById("totalVisitors").value = saved.visitors;
                    if (saved.converted) document.getElementById("convertedSales").value = saved.converted;
                    if (saved.lost) document.getElementById("lostSales").value = saved.lost;
                    if (saved.revenueLost) document.getElementById("revenueLost").value = saved.revenueLost;
                    if (saved.avgRevenue) document.getElementById("avgRevenue").value = saved.avgRevenue;
                }
            } catch (err) {}
        });

        function saveData(e) {
            e.preventDefault();
            const rawUrl = document.getElementById("mapsUrl").value.trim();
            if(!rawUrl) return alert("Google Maps URL is required as a key.");
            
            const urlWithoutSlash = rawUrl.replace(/\/+$/, "");
            const storageKey = "admin1_" + rawUrl;
            
            const data = {
                name: document.getElementById("businessName").value.trim(),
                mapsUrl: rawUrl,
                location: document.getElementById("location").value.trim(),
                category: document.getElementById("category").value.trim(),
                rating: document.getElementById("rating").value,
                reviews: document.getElementById("reviews").value,
                visitors: document.getElementById("totalVisitors").value,
                converted: document.getElementById("convertedSales").value,
                lost: document.getElementById("lostSales").value,
                revenueLost: document.getElementById("revenueLost").value,
                avgRevenue: document.getElementById("avgRevenue").value,
                timestamp: Date.now()
            };
            
            try {
                localStorage.setItem(storageKey, JSON.stringify(data));
                if (urlWithoutSlash !== rawUrl) {
                    localStorage.setItem("admin1_" + urlWithoutSlash, JSON.stringify(data));
                }
                localStorage.setItem("admin1_latest", JSON.stringify(data));
                showAlert("Business Data successfully stored for Vercel / GitHub Pages!");
            } catch (err) {
                console.error("Storage Error:", err);
                alert("Data storage failed! Check if your browser restricts 'localStorage' natively (e.g., incognito mode) on static hosts.");
            }
        }

        function showAlert(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            div.style.position = 'fixed';
            div.style.top = '20px';
            div.style.right = '20px';
            div.style.background = '#10b981';
            div.style.color = '#fff';
            div.style.padding = '1rem 2rem';
            div.style.borderRadius = '8px';
            div.style.boxShadow = '0 10px 30px rgba(16,185,129,0.3)';
            div.style.fontWeight = '600';
            div.style.zIndex = '9999';
            div.style.opacity = '0';
            div.style.transform = 'translateY(-20px)';
            div.style.transition = 'all 0.3s';
            document.body.appendChild(div);

            setTimeout(() => { div.style.opacity = '1'; div.style.transform = 'translateY(0)'; }, 10);
            setTimeout(() => {
                div.style.opacity = '0'; div.style.transform = 'translateY(-20px)';
                setTimeout(() => div.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
